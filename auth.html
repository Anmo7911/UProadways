<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF9F6">
  <title>Sign In | ZAYA Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="eyebrow">ZAYA ADMIN</div>
      <h1 id="authTitle">Welcome back</h1>
      <p class="auth-subtitle" id="authSubtitle">Sign in to continue to the ZAYA admin portal.</p>

      <form class="form-stack" id="authForm" novalidate>
        <label class="form-label">
          Email
          <input class="form-control" name="email" type="email" autocomplete="email" required>
        </label>

        <label class="form-label">
          Password
          <input class="form-control" name="password" type="password" autocomplete="current-password" minlength="6" required>
        </label>

        <div class="form-message" id="authMessage" role="status"></div>

        <button class="primary-button" id="authSubmit" type="submit">Sign in</button>
        <button class="text-button" id="modeToggle" type="button">Need an account? Sign up</button>
        <a class="secondary-button" href="/">Return to storefront</a>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
