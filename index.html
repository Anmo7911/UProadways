<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>जन्मदिन की शुभकामनाएं - भगवान नरेंद्र मोदी</title>
  <!-- Google Fonts for crisp Hindi typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #241442 0%, #0d061f 100%);
      --gold: #f4c042;
      --glow-color: rgba(255, 179, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #fff;
      overflow-x: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 28px;
      padding: 36px 28px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Top Profile Image */
    .profile-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 16px;
    }

    .profile-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--gold);
      box-shadow: 0 0 20px var(--glow-color);
      transition: transform 0.3s ease;
    }

    .profile-wrap:hover img {
      transform: scale(1.05);
    }

    .name-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 1px;
      color: #dfd5ec;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    /* Diya Stage */
    .diya-stage {
      height: 160px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: 25px;
    }

    /* Flame */
    .flame-container {
      position: absolute;
      bottom: 45px;
      opacity: 0;
      transform: scale(0.2);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .flame {
      width: 26px;
      height: 60px;
      background: radial-gradient(circle, #fff 10%, #ffde59 40%, #ff5722 80%);
      border-radius: 50% 50% 35% 35% / 60% 60% 40% 40%;
      filter: drop-shadow(0 0 12px #ff9800) drop-shadow(0 0 25px #ff5722);
    }

    /* Diya Base */
    .diya-base {
      position: relative;
      width: 140px;
      height: 48px;
      background: linear-gradient(180deg, #d35400 0%, #8b2500 100%);
      border-radius: 0 0 100px 100px;
      box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.4), 0 8px 18px rgba(0, 0, 0, 0.6);
      border-top: 3px solid #f39c12;
    }

    .diya-rim {
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 16px;
      background: #e67e22;
      border-radius: 50%;
      border: 2px solid #f1c40f;
    }

    /* Ambient Glow behind Diya */
    .diya-glow {
      position: absolute;
      bottom: 20px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(255, 193, 7, 0.4) 0%, transparent 70%);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    /* Lit state animations */
    .diya-stage.lit .flame-container {
      opacity: 1;
      transform: scale(1);
      animation: flicker 1.8s infinite alternate ease-in-out;
    }

    .diya-stage.lit .diya-glow {
      opacity: 1;
      animation: pulseGlow 2.5s infinite alternate ease-in-out;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-1deg); }
      25% { transform: scale(1.04, 0.96) rotate(1.5deg); }
      50% { transform: scale(0.97, 1.03) rotate(-1deg); }
      75% { transform: scale(1.02, 0.98) rotate(1deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.35); opacity: 0.85; }
    }

    /* Interactive Button */
    .btn-light {
      background: linear-gradient(45deg, #f39c12, #e74c3c);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-light:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(243, 156, 18, 0.6);
    }

    .btn-light:active {
      transform: translateY(1px);
    }

    .btn-light:disabled {
      background: #444;
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.6;
    }

    /* Celebration Banner */
    .greeting-message {
      margin-top: 24px;
      padding: 16px 20px;
      background: rgba(255, 215, 0, 0.12);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 16px;
      display: none;
      animation: fadeInUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .greeting-message p {
      font-size: 1.15rem;
      color: #ffeaa7;
      font-weight: 600;
      line-height: 1.6;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

        <div class="flame"></div>
      </div>
      <div class="diya-base">
        <div class="diya-rim"></div>
      </div>
    </div>

    <!-- Action Button -->
    <button class="btn-light" id="wishBtn" onclick="lightDiya()">
      🪔 दिया जलाएं और बधाई दें
    </button>

    <!-- Wishes Confirmation Message -->
    <div class="greeting-message" id="msgBox">
      <p>✨ आपने भगवान नरेंद्र मोदी को जन्मदिन की बधाई दे दी! 🎉🎂</p>
    </div>
  </div>

  <script>
    function triggerConfetti() {
      const count = 200;
      const defaults = { origin: { y: 0.7 } };

      function fire(particleRatio, opts) {
        confetti(Object.assign({}, defaults, opts, {
          particleCount: Math.floor(count * particleRatio)
        }));
      }

      fire(0.25, { spread: 26, startVelocity: 55 });
      fire(0.2, { spread: 60 });
      fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
      fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
      fire(0.1, { spread: 120, startVelocity: 45 });
    }

    function lightDiya() {
      const diya = document.getElementById('diyaStage');
      const msg = document.getElementById('msgBox');
      const btn = document.getElementById('wishBtn');

      // Light up the Diya
      diya.classList.add('lit');

      // Display the Hindi confirmation message
      msg.style.display = 'block';

      // Launch Confetti celebration
      triggerConfetti();

      // Update button state
      btn.innerText = '✨ बधाई भेजी जा चुकी है';
      btn.disabled = true;
    }
  </script>
</body>
</html>
