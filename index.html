<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Driver - Ambient Music Experience</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background Animated Scene -->
  <div class="scene">
    <div class="rain"></div>
    <div class="mountains"></div>
    <div class="road"></div>
    
    <!-- Central Bus Graphic -->
    <div class="bus-container">
      <img src="bus.png" alt="Bus" class="bus-image" />
      <button id="horn-btn" class="horn-bubble">📢 HORN OK PLEASE</button>
    </div>
  </div>

  <!-- Hidden YouTube Player Container -->
  <div id="youtube-player" style="display:none;"></div>

  <!-- Player Controls UI -->
  <div class="player-container">
    <div class="track-info">
      <img id="track-thumb" src="" alt="Album Art" />
      <div>
        <h3 id="track-title">Loading Track...</h3>
        <p id="track-artist">Artist</p>
      </div>
    </div>

    <div class="controls">
      <button id="prev-btn">⏮</button>
      <button id="play-btn">▶</button>
      <button id="next-btn">⏭</button>
    </div>

    <div class="progress-bar-container">
      <span id="current-time">0:00</span>
      <input type="range" id="seek-bar" value="0" max="100" />
      <span id="total-time">0:00</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
