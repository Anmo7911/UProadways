<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAYA | Women's Pret & Couture</title>
  <style>
    :root {
      --bg-primary: #FAF9F6;
      --bg-secondary: #FFFFFF;
      --text-main: #1C1917;
      --text-muted: #78716C;
      --accent-gold: #D4AF37;
      --accent-dark: #292524;
      --border-color: #E7E5E4;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* Header & Navigation */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
    }
    .top-bar {
      background: var(--accent-dark);
      color: #FFF;
      text-align: center;
      padding: 6px 12px;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .brand-logo {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--text-main);
      text-decoration: none;
    }
    .nav-actions { display: flex; gap: 16px; align-items: center; }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      font-size: 1.25rem;
      color: var(--text-main);
    }
    .badge {
      position: absolute;
      top: -6px;
      right: -8px;
      background: var(--accent-gold);
      color: #FFF;
      font-size: 0.65rem;
      font-weight: 700;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hero & Filters */
    .hero {
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      padding: 60px 20px;
      margin-bottom: 24px;
    }
    .hero h1 { font-family: var(--font-serif); font-size: 2rem; margin-bottom: 8px; }
    .hero p { font-size: 0.9rem; opacity: 0.9; }

    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 16px 16px;
      max-width: 1200px;
      margin: 0 auto;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent-dark);
      color: white;
      border-color: var(--accent-dark);
    }

    /* Product Grid & Cards */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (min-width: 768px) {
      .product-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; }
    }

    .product-card {
      background: var(--bg-secondary);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .product-image-wrap {
      position: relative;
      padding-top: 133%;
      overflow: hidden;
    }
    .product-image-wrap img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease;
    }
    .product-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
    .product-title { font-family: var(--font-serif); font-size: 0.95rem; margin-bottom: 4px; }
    .product-price { font-weight: 600; font-size: 0.9rem; color: var(--accent-dark); }
    .original-price { text-decoration: line-through; color: var(--text-muted); font-weight: 400; font-size: 0.8rem; margin-left: 4px; }

    /* Modals & Drawers */
    .drawer-overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      z-index: 50;
      display: none;
    }
    .drawer-overlay.active { display: block; }
    .drawer {
      position: fixed;
      top:0; right: -100%;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: var(--bg-secondary);
      z-index: 51;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .drawer.active { right: 0; }
    .drawer-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-content { padding: 16px; flex-grow: 1; overflow-y: auto; }
    .drawer-footer { padding: 16px; border-top: 1px solid var(--border-color); background: var(--bg-primary); }

    .cart-item {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }
    .cart-item img { width: 60px; height: 80px; object-fit: cover; border-radius: 4px; }
    .cart-item-info { flex-grow: 1; }

    /* Form Styles */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-muted); }
    .form-control {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-dark);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-gold { background: var(--accent-gold); color: white; }

    .pdp-view { display: none; padding: 16px 0; }
    .pdp-view.active { display: block; }
    .swatch-group { display: flex; gap: 8px; margin: 8px 0 16px; }
    .swatch {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .swatch.active { border-color: var(--accent-dark); background: var(--accent-dark); color: white; }
    
    .badge-discount {
      display: inline-block;
      background: #D1E7DD;
      color: #0F5132;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <!-- Top Banner -->
  <div class="top-bar">COMPLIMENTARY SHIPPING ON ALL PREPAID ORDERS | PREPAID 10% OFF</div>

  <!-- Header -->
  <header class="site-header">
    <div class="nav-container">
      <button class="icon-btn" id="menuToggleBtn">☰</button>
      <a href="#" class="brand-logo" onclick="showCatalog()">ZAYA</a>
      <div class="nav-actions">
        <button class="icon-btn" onclick="openCart()">
          🛒
          <span class="badge" id="cartBadge">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar Menu -->
  <div class="drawer-overlay" id="overlay" onclick="closeAllDrawers()"></div>
  <div class="drawer" id="mobileMenu">
    <div class="drawer-header">
      <h3>Menu</h3>
      <button class="icon-btn" onclick="closeAllDrawers()">✕</button>
    </div>
    <div class="drawer-content">
      <p style="padding: 8px 0; cursor: pointer;" onclick="filterCategory('All')">All Collections</p>
      <p style="padding: 8px 0; cursor: pointer;" onclick="filterCategory('Pret')">Pret Collection</p>
      <p style="padding: 8px 0; cursor: pointer;" onclick="filterCategory('Couture')">Couture</p>
    </div>
  </div>

  <!-- Main Content Views -->
  <main class="container">
    
    <!-- Catalog View -->
    <div id="catalogView">
      <div class="hero">
        <h1>Festive Luxury '26</h1>
        <p>Elegance redefined with handcrafted pret & couture.</p>
      </div>

      <div class="filter-chips">
        <button class="chip active" onclick="filterCategory('All', this)">All</button>
        <button class="chip" onclick="filterCategory('Pret', this)">Pret</button>
        <button class="chip" onclick="filterCategory('Couture', this)">Couture</button>
      </div>

      <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- PDP View -->
    <div class="pdp-view" id="pdpView">
      <button class="icon-btn" onclick="showCatalog()" style="margin-bottom: 16px;">← Back to Collection</button>
      <div id="pdpContent"></div>
    </div>

  </main>

  <!-- Cart Drawer -->
  <div class="drawer" id="cartDrawer">
    <div class="drawer-header">
      <h3>Your Bag</h3>
      <button class="icon-btn" onclick="closeAllDrawers()">✕</button>
    </div>
    <div class="drawer-content" id="cartItemsContainer"></div>
    <div class="drawer-footer">
      <div style="margin-bottom: 12px;">
        <label style="font-size:0.8rem;">Payment Method:</label>
        <div style="display: flex; gap: 8px; margin-top: 4px;">
          <label style="font-size:0.85rem;"><input type="radio" name="paymentMethod" value="PREPAID" checked onchange="renderCart()"> Prepaid (10% OFF)</label>
          <label style="font-size:0.85rem;"><input type="radio" name="paymentMethod" value="COD" onchange="renderCart()"> COD</label>
        </div>
      </div>
      <div class="form-group">
        <input type="text" id="couponInput" class="form-control" placeholder="Enter Coupon Code (e.g. ZAYA10)">
        <button class="btn" style="margin-top: 4px; padding: 6px;" onclick="applyCoupon()">Apply Coupon</button>
      </div>
      <div id="summaryDetails" style="font-size:0.85rem; margin-bottom: 12px;"></div>
      <button class="btn btn-gold" onclick="submitOrderToWhatsApp()">Checkout via WhatsApp</button>
    </div>
  </div>

  <script>
    // Sample Products Data
    const products = [
      {
        id: "z1",
        title: "Velvet Anarkali Set",
        category: "Couture",
        price: 8999,
        originalPrice: 10999,
        images: [
          "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?auto=format&fit=crop&w=600&q=80",
          "https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=600&q=80"
        ],
        sizes: ["S", "M", "L", "XL"]
      },
      {
        id: "z2",
        title: "Chanderi Silk Kurta",
        category: "Pret",
        price: 3499,
        originalPrice: 4299,
        images: [
          "https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=600&q=80"
        ],
        sizes: ["XS", "S", "M", "L"]
      }
    ];

    let cart = [];
    let selectedCategory = "All";
    let activePDPProduct = null;
    let selectedSize = "";
    let appliedCoupon = null;

    // Initialize App
    document.addEventListener("DOMContentLoaded", () => {
      renderProducts();
      setupMenuToggle();
    });

    function setupMenuToggle() {
      document.getElementById('menuToggleBtn').addEventListener('click', () => {
        document.getElementById('mobileMenu').classList.add('active');
        document.getElementById('overlay').classList.add('active');
      });
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";
      
      const filtered = selectedCategory === "All" 
        ? products 
        : products.filter(p => p.category === selectedCategory);

      filtered.forEach(product => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.onclick = () => openPDP(product.id);
        
        card.innerHTML = `
          <div class="product-image-wrap">
            <img src="${product.images[0]}" alt="${product.title}">
          </div>
          <div class="product-info">
            <div class="product-title">${product.title}</div>
            <div>
              <span class="product-price">₹${product.price}</span>
              ${product.originalPrice ? `<span class="original-price">₹${product.originalPrice}</span>` : ''}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(category, el) {
      selectedCategory = category;
      if(el) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
      }
      showCatalog();
      renderProducts();
      closeAllDrawers();
    }

    function openPDP(productId) {
      activePDPProduct = products.find(p => p.id === productId);
      selectedSize = activePDPProduct.sizes[0] || "";

      const pdpContent = document.getElementById("pdpContent");
      pdpContent.innerHTML = `
        <div style="display: grid; gap: 16px;">
          <img src="${activePDPProduct.images[0]}" style="width:100%; border-radius:4px;" alt="">
          <h2>${activePDPProduct.title}</h2>
          <div>
            <span style="font-size:1.2rem; font-weight:bold;">₹${activePDPProduct.price}</span>
            ${activePDPProduct.originalPrice ? `<span class="original-price" style="font-size:1rem;">₹${activePDPProduct.originalPrice}</span>` : ''}
          </div>
          <div>
            <label style="font-size:0.85rem; font-weight:600;">Select Size:</label>
            <div class="swatch-group">
              ${activePDPProduct.sizes.map(size => `
                <div class="swatch ${size === selectedSize ? 'active' : ''}" onclick="selectSize('${size}', this)">${size}</div>
              `).join('')}
            </div>
          </div>
          <button class="btn btn-gold" onclick="addToCart()">Add to Bag</button>
        </div>
      `;

      document.getElementById("catalogView").style.display = "none";
      document.getElementById("pdpView").classList.add("active");
    }

    function selectSize(size, el) {
      selectedSize = size;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
    }

    function showCatalog() {
      document.getElementById("pdpView").classList.remove("active");
      document.getElementById("catalogView").style.display = "block";
    }

    function addToCart() {
      if(!activePDPProduct) return;
      cart.push({
        ...activePDPProduct,
        selectedSize: selectedSize
      });
      updateBadge();
      openCart();
    }

    function updateBadge() {
      document.getElementById("cartBadge").innerText = cart.length;
    }

    function openCart() {
      renderCart();
      document.getElementById("cartDrawer").classList.add("active");
      document.getElementById("overlay").classList.add("active");
    }

    function closeAllDrawers() {
      document.getElementById("mobileMenu").classList.remove("active");
      document.getElementById("cartDrawer").classList.remove("active");
      document.getElementById("overlay").classList.remove("active");
    }

    function applyCoupon() {
      const val = document.getElementById("couponInput").value.trim().toUpperCase();
      if(val === "ZAYA10") {
        appliedCoupon = { code: "ZAYA10", discountPercent: 10 };
        alert("Coupon Applied: 10% Off");
      } else {
        alert("Invalid Coupon Code");
        appliedCoupon = null;
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cartItemsContainer");
      if (cart.length === 0) {
        container.innerHTML = "<p>Your bag is empty.</p>";
        document.getElementById("summaryDetails").innerHTML = "";
        return;
      }

      container.innerHTML = cart.map((item, idx) => `
        <div class="cart-item">
          <img src="${item.images[0]}" alt="">
          <div class="cart-item-info">
            <div style="font-weight:600; font-size:0.9rem;">${item.title}</div>
            <div style="font-size:0.8rem; color:var(--text-muted);">Size: ${item.selectedSize}</div>
            <div style="font-size:0.85rem; font-weight:600;">₹${item.price}</div>
            <button onclick="removeFromCart(${idx})" style="border:none; background:none; color:red; font-size:0.75rem; cursor:pointer;">Remove</button>
          </div>
        </div>
      `).join('');

      // Calculation
      const subtotal = cart.reduce((acc, item) => acc + item.price, 0);
      
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked')?.value || "PREPAID";
      
      let couponDiscount = 0;
      if (appliedCoupon && subtotal > 0) {
        couponDiscount = (subtotal * appliedCoupon.discountPercent) / 100;
      }

      let prepaidDiscount = 0;
      if (paymentMethod === "PREPAID") {
        prepaidDiscount = ((subtotal - couponDiscount) * 0.10); // 10% off for Prepaid
      }

      const grandTotal = Math.max(0, subtotal - couponDiscount - prepaidDiscount);

      document.getElementById("summaryDetails").innerHTML = `
        <div style="display:flex; justify-content:space-between;"><span>Subtotal:</span> <span>₹${subtotal.toFixed(2)}</span></div>
        ${couponDiscount > 0 ? `<div style="display:flex; justify-content:space-between; color:green;"><span>Coupon Discount (${appliedCoupon.code}):</span> <span>-₹${couponDiscount.toFixed(2)}</span></div>` : ''}
        ${paymentMethod === "PREPAID" ? `<div style="display:flex; justify-content:space-between; color:green;"><span>Prepaid Discount (10%):</span> <span>-₹${prepaidDiscount.toFixed(2)}</span></div>` : ''}
        <hr style="margin: 4px 0;">
        <div style="display:flex; justify-content:space-between; font-weight:bold;"><span>Total:</span> <span>₹${grandTotal.toFixed(2)}</span></div>
      `;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateBadge();
      renderCart();
    }

    // Fixed WhatsApp submission script
    function submitOrderToWhatsApp() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked')?.value || "PREPAID";

      let couponDiscount = 0;
      if (appliedCoupon && subtotal > 0) {
        couponDiscount = (subtotal * appliedCoupon.discountPercent) / 100;
      }

      let prepaidDiscount = 0;
      if (paymentMethod === "PREPAID") {
        prepaidDiscount = ((subtotal - couponDiscount) * 0.10);
      }

      const grandTotal = Math.max(0, subtotal - couponDiscount - prepaidDiscount);

      let orderText = `*NEW ORDER - ZAYA*\n\n`;
      orderText += `*Items Ordered:*\n`;

      cart.forEach((item, index) => {
        orderText += `${index + 1}. ${item.title} (Size: ${item.selectedSize}) - ₹${item.price}\n`;
      });

      orderText += `\n*Order Summary:*`;
      orderText += `\nSubtotal: ₹${subtotal.toFixed(2)}`;
      
      if (couponDiscount > 0) {
        orderText += `\nCoupon Discount (${appliedCoupon.code}): -₹${couponDiscount.toFixed(2)}`;
      }
      
      if (paymentMethod === "PREPAID") {
        orderText += `\nPrepaid Discount (10% OFF): -₹${prepaidDiscount.toFixed(2)}`;
      }

      orderText += `\n*Payment Method:* ${paymentMethod}`;
      orderText += `\n*Grand Total:* ₹${grandTotal.toFixed(2)}`;

      const phoneNumber = "919876543210"; // Replace with your WhatsApp business number
      const encodedMsg = encodeURIComponent(orderText);
      
      window.open(`https://wa.me/${phoneNumber}?text=${encodedMsg}`, '_blank');
    }
  </script>
</body>
</html>
