<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhaba Radio — Nonstop Highway Hindi Hits</title>
<meta name="description" content="Pull over at Dhaba Radio — nonstop 90s & 2000s Hindi songs, playing on loop since the bus stopped for chai. Free, no login.">
<meta name="theme-color" content="#241608">

<!-- ===================== FONTS ===================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#241608;
    --cream:#f4ead4;
    --cream-soft:#efe0bf;
    --card:#fff8e8;
    --rust:#bb4d25;
    --rust-dark:#8e3a1b;
    --green:#2f5233;
    --mustard:#d9a441;
    --line:rgba(36,22,8,0.14);
    --shadow:0 10px 30px rgba(36,22,8,0.18);
    --radius:16px;
    --font-display:'Rajdhani', sans-serif;
    --font-body:'Poppins', sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--mustard);color:var(--ink);}

  /* subtle paper grain */
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    z-index:1000;
    opacity:.05;
    background-image:radial-gradient(#241608 1px, transparent 1px);
    background-size:3px 3px;
  }

  .wrap{max-width:1080px;margin:0 auto;padding:0 20px;}

  /* ===================== HERO (FULLSCREEN) ===================== */
  .hero{
    position:relative;
    height:100vh; /* Set to full screen */
    width:100vw;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
    border-bottom:4px solid var(--ink);
  }
  .hero video{
    position:absolute;inset:0;
    width:100%;height:100%;object-fit:cover;
    filter:saturate(1.05) contrast(1.02);
  }
  
  /* Bottom Vignette Gradient Effect */
  .hero .scrim{
    position:absolute;inset:0;
    background:
      linear-gradient(to top, 
        rgba(0, 0, 0, 0.9) 0%, 
        rgba(0, 0, 0, 0.4) 35%, 
        transparent 70%
      );
  }
  .hero-content{
    position:relative;z-index:2;
    width:100%;
    padding:0 20px 30px;
    max-width:1080px;margin:0 auto;
    color:var(--cream);
  }
  .hero-meta{
    font-size:14px;
    color:rgba(244,234,212,0.85);
    display:flex;gap:16px;flex-wrap:wrap;
    font-family:var(--font-display);
    letter-spacing:.05em;
  }

  /* ===================== CATEGORY TICKER ===================== */
  .ticker-row{
    border-bottom:1px solid var(--line);
    background:var(--cream-soft);
    overflow:hidden;
  }
  .ticker-inner{
    display:flex;gap:10px;padding:12px 20px;
    max-width:1080px;margin:0 auto;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .ticker-inner::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    padding:8px 16px;
    border-radius:999px;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    white-space:nowrap;
  }
  .chip.active{background:var(--ink);color:var(--cream);}
  .chip[disabled]{opacity:.4;cursor:not-allowed;}

  /* ===================== MAIN LAYOUT ===================== */
  .main{
    max-width:1080px;margin:0 auto;
    padding:36px 20px 140px;
  }
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:16px;
  }
  .section-head h2{
    font-family:var(--font-display);
    font-size:26px;font-weight:700;margin:0;
  }
  .section-head span{font-size:13px;color:var(--rust-dark);font-weight:600;}

  .track-list{list-style:none;margin:0;padding:0;}
  .track{
    display:flex;align-items:center;gap:14px;
    padding:10px 10px;
    border-radius:12px;
    cursor:pointer;
    transition:background .12s ease;
    border-bottom:1px solid var(--line);
  }
  .track:hover{background:var(--card);}
  .track.playing{background:var(--card);box-shadow:inset 3px 0 0 var(--rust);}
  .track-num{
    width:26px;text-align:center;font-family:var(--font-display);
    font-weight:600;color:var(--rust-dark);font-size:15px;flex-shrink:0;
  }
  .track.playing .track-num{color:var(--rust);}
  .track-art{
    width:52px;height:52px;border-radius:8px;object-fit:cover;
    flex-shrink:0;border:1px solid var(--line);
    background:var(--cream-soft);
  }
  .track-info{min-width:0;flex:1;}
  .track-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track-artist{font-size:13px;color:#5b4a33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track-playicon{width:22px;height:22px;flex-shrink:0;color:var(--rust);display:none;}
  .track.playing .track-playicon{display:block;}

  /* ===================== PLAYER BAR ===================== */
  .player-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--ink);
    color:var(--cream);
    z-index:200;
    border-top:3px solid var(--rust);
  }
  .player-inner{
    max-width:1080px;margin:0 auto;
    padding:10px 20px 14px;
  }
  .progress-row{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-display);font-size:12px;font-weight:600;
    color:rgba(244,234,212,0.7);
    margin-bottom:8px;
  }
  .progress-track{
    flex:1;height:5px;background:rgba(244,234,212,0.18);
    border-radius:99px;position:relative;cursor:pointer;
  }
  .progress-fill{
    position:absolute;left:0;top:0;bottom:0;
    background:var(--rust);border-radius:99px;width:0%;
  }
  .player-controls{
    display:flex;align-items:center;gap:14px;
  }
  .now-art{width:46px;height:46px;border-radius:8px;object-fit:cover;flex-shrink:0;}
  .now-info{min-width:0;flex:1;}
  .now-title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .now-artist{font-size:12px;color:rgba(244,234,212,0.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ctrl-btn{
    background:none;border:none;color:var(--cream);
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:background .12s ease;
  }
  .ctrl-btn:hover{background:rgba(244,234,212,0.1);}
  .ctrl-btn svg{width:20px;height:20px;}
  .ctrl-btn.play-pause{
    background:var(--rust);width:44px;height:44px;
  }
  .ctrl-btn.play-pause:hover{background:var(--rust-dark);}
  .kbd-hint{
    display:none;
    font-size:11px;color:rgba(244,234,212,0.45);
    margin-left:auto;
  }
  @media(min-width:720px){ .kbd-hint{display:block;} }

  /* ===================== FOOTER ===================== */
  .footer{
    max-width:1080px;margin:0 auto;
    padding:20px 20px 160px;
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:10px;
    font-size:13px;color:#5b4a33;
    border-top:1px solid var(--line);
  }

  /* youtube iframe hidden but present in DOM */
  #yt-player{position:fixed;bottom:-1000px;left:-1000px;width:1px;height:1px;}

  @media(max-width:600px){
    .track-artist{display:none;}
  }
</style>
</head>
<body>

<!-- ===================== HERO ===================== -->
<section class="hero">
  <video autoplay muted loop playsinline poster="assets/bus-loop-poster.jpg">
    <source src="assets/bus-loop.mp4" type="video/mp4">
  </video>
  <div class="scrim"></div>
  <div class="hero-content">
    <div class="hero-meta">
      <span id="trackCount">6 tracks · non-stop</span>
      <span>·</span>
      <span>NH 27 · Dhaba Radio</span>
    </div>
  </div>
</section>

<!-- ===================== CATEGORY TICKER ===================== -->
<div class="ticker-row">
  <div class="ticker-inner">
    <button class="chip active">Highway Hits</button>
    <button class="chip" disabled>Sufi Nights</button>
    <button class="chip" disabled>Wedding Season</button>
    <button class="chip" disabled>Monsoon</button>
    <button class="chip" disabled>Dhaba Classics</button>
  </div>
</div>

<!-- ===================== MAIN ===================== -->
<div class="main">
  <div class="section-head">
    <h2>On the tape deck</h2>
    <span id="nowPlayingLabel">tap any track to start</span>
  </div>
  <ul class="track-list" id="trackList"></ul>
</div>

<div class="footer">
  <span>Dhaba Radio · powered by the roadside, not by us</span>
  <span>Share the stop: dhabaradio.example</span>
</div>

<!-- ===================== PLAYER BAR ===================== -->
<div class="player-bar">
  <div class="player-inner">
    <div class="progress-row">
      <span id="curTime">0:00</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span id="durTime">0:00</span>
    </div>
    <div class="player-controls">
      <img class="now-art" id="nowArt" src="" alt="">
      <div class="now-info">
        <div class="now-title" id="nowTitle">Nothing playing</div>
        <div class="now-artist" id="nowArtist">Press play on any track</div>
      </div>
      <button class="ctrl-btn" id="prevBtn" title="Previous (P)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-pause" id="playBtn" title="Play/Pause (Space)">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Next (N)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
      <span class="kbd-hint">Space play/pause · ← → seek · N/P track</span>
    </div>
  </div>
</div>

<!-- Hidden YouTube player mount -->
<div id="yt-player"></div>

<script>
/* =====================================================
   PLAYLIST
===================================================== */
const PLAYLIST = [
  { id: "xteZNX3B4yA", title: "Tumse Milke Dil Ka Jo Haal", artist: "Main Hoon Na · Sonu Nigam" },
  { id: "9MX-QejdVaQ", title: "Chaiyya Chaiyya",            artist: "Dil Se · Sukhwinder Singh, Sapna Awasthi" },
  { id: "-LESbtPT8uw", title: "Kaho Naa Pyaar Hai (Title)", artist: "Alka Yagnik, Udit Narayan" },
  { id: "aGbPyM6lzBs", title: "Ek Pal Ka Jeena",             artist: "Kaho Naa Pyaar Hai · Lucky Ali" },
  { id: "e3TFNC-FRUA", title: "Dil Ne Dil Ko Pukara",        artist: "Kaho Naa Pyaar Hai · Babul Supriyo" },
  { id: "vCTW2GfcepQ", title: "Tujhe Dekha Toh",             artist: "DDLJ · Kumar Sanu, Lata Mangeshkar" }
];

function thumb(id){ return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; }

/* =====================================================
   STATE
===================================================== */
let ytPlayer = null;
let ytReady = false;
let currentIndex = -1;
let isPlaying = false;
let progressTimer = null;

/* =====================================================
   BUILD TRACK LIST UI
===================================================== */
const trackListEl = document.getElementById('trackList');
document.getElementById('trackCount').textContent = `${PLAYLIST.length} tracks · non-stop`;

PLAYLIST.forEach((t, i) => {
  const li = document.createElement('li');
  li.className = 'track';
  li.dataset.index = i;
  li.innerHTML = `
    <span class="track-num">${i + 1}</span>
    <img class="track-art" src="${thumb(t.id)}" alt="">
    <div class="track-info">
      <div class="track-title">${t.title}</div>
      <div class="track-artist">${t.artist}</div>
    </div>
    <svg class="track-playicon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  `;
  li.addEventListener('click', () => playTrack(i));
  trackListEl.appendChild(li);
});

function renderActiveTrack(){
  document.querySelectorAll('.track').forEach(el => {
    el.classList.toggle('playing', Number(el.dataset.index) === currentIndex);
  });
}

/* =====================================================
   YOUTUBE IFRAME API
===================================================== */
const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

window.onYouTubeIframeAPIReady = function(){
  ytPlayer = new YT.Player('yt-player', {
    height: '1', width: '1',
    playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1 },
    events: {
      onReady: () => { ytReady = true; },
      onStateChange: onPlayerStateChange
    }
  });
};

function onPlayerStateChange(e){
  if (e.data === YT.PlayerState.PLAYING){
    isPlaying = true;
    updatePlayIcon();
    startProgressLoop();
  } else if (e.data === YT.PlayerState.PAUSED){
    isPlaying = false;
    updatePlayIcon();
    stopProgressLoop();
  } else if (e.data === YT.PlayerState.ENDED){
    playTrack((currentIndex + 1) % PLAYLIST.length);
  }
}

function playTrack(index){
  if (!ytReady){
    setTimeout(() => playTrack(index), 300);
    return;
  }
  currentIndex = index;
  const t = PLAYLIST[index];
  ytPlayer.loadVideoById(t.id);
  ytPlayer.playVideo();

  document.getElementById('nowArt').src = thumb(t.id);
  document.getElementById('nowTitle').textContent = t.title;
  document.getElementById('nowArtist').textContent = t.artist;
  document.getElementById('nowPlayingLabel').textContent = `now playing · track ${index + 1} of ${PLAYLIST.length}`;
  renderActiveTrack();
}

function togglePlayPause(){
  if (currentIndex === -1){ playTrack(0); return; }
  if (isPlaying){ ytPlayer.pauseVideo(); } else { ytPlayer.playVideo(); }
}

function updatePlayIcon(){
  const icon = document.getElementById('playIcon');
  icon.innerHTML = isPlaying
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

/* =====================================================
   PROGRESS BAR
===================================================== */
function fmtTime(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function startProgressLoop(){
  stopProgressLoop();
  progressTimer = setInterval(() => {
    if (!ytPlayer || !ytPlayer.getCurrentTime) return;
    const cur = ytPlayer.getCurrentTime();
    const dur = ytPlayer.getDuration();
    document.getElementById('curTime').textContent = fmtTime(cur);
    document.getElementById('durTime').textContent = fmtTime(dur);
    document.getElementById('progressFill').style.width = dur ? `${(cur / dur) * 100}%` : '0%';
  }, 400);
}
function stopProgressLoop(){ if (progressTimer) clearInterval(progressTimer); }

document.getElementById('progressTrack').addEventListener('click', (e) => {
  if (!ytPlayer || !ytPlayer.getDuration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  ytPlayer.seekTo(ytPlayer.getDuration() * pct, true);
});

/* =====================================================
   CONTROLS
===================================================== */
document.getElementById('playBtn').addEventListener('click', togglePlayPause);
document.getElementById('nextBtn').addEventListener('click', () => {
  playTrack(currentIndex === -1 ? 0 : (currentIndex + 1) % PLAYLIST.length);
});
document.getElementById('prevBtn').addEventListener('click', () => {
  playTrack(currentIndex <= 0 ? PLAYLIST.length - 1 : currentIndex - 1);
});

/* =====================================================
   KEYBOARD SHORTCUTS
===================================================== */
document.addEventListener('keydown', (e) => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  switch(e.code){
    case 'Space':
      e.preventDefault(); togglePlayPause(); break;
    case 'ArrowRight':
      if (ytPlayer && ytPlayer.getCurrentTime) ytPlayer.seekTo(ytPlayer.getCurrentTime() + 5, true);
      break;
    case 'ArrowLeft':
      if (ytPlayer && ytPlayer.getCurrentTime) ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() - 5), true);
      break;
    case 'KeyN':
      document.getElementById('nextBtn').click(); break;
    case 'KeyP':
      document.getElementById('prevBtn').click(); break;
  }
});
</script>
</body>
</html>
