<style>
/* ---------------------------------
CSS VARIABLES & RESET
--------------------------------- */
:root {
--bg-cream: #FAF8F5;
--bg-white: #FFFFFF;
--primary: #1C1917;
--primary-accent: #8E5B4C;
--accent-soft: #F4EBE6;
--text-main: #292524;
--text-muted: #78716C;
--border-color: #E7E5E4;
--wa-green: #25D366;
--wa-hover: #1EBE5B;
--shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
--shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
--radius-sm: 8px;
--radius-md: 14px;
--radius-full: 9999px;
--font-serif: 'Cormorant Garamond', Georgia, serif;
--font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
-webkit-tap-highlight-color: transparent;
}

body {
background-color: var(--bg-cream);
color: var(--text-main);
font-family: var(--font-sans);
line-height: 1.5;
padding-bottom: 70px;
}

a {
color: inherit;
text-decoration: none;
}

button {
font-family: inherit;
cursor: pointer;
border: none;
background: none;
transition: all 0.2s ease;
}

img {
max-width: 100%;
height: auto;
display: block;
}

/* ---------------------------------
HEADER & ANNOUNCEMENT BAR
--------------------------------- */
.announcement-bar {
background: var(--primary);
color: #fff;
font-size: 0.75rem;
text-align: center;
padding: 7px 12px;
letter-spacing: 0.05em;
text-transform: uppercase;
font-weight: 500;
}

.navbar {
background: rgba(250, 248, 245, 0.95);
backdrop-filter: blur(10px);
position: sticky;
top: 0;
z-index: 40;
border-bottom: 1px solid var(--border-color);
display: flex;
justify-content: space-between;
align-items: center;
padding: 14px 20px;
}

.logo {
font-family: var(--font-serif);
font-size: 1.9rem;
font-weight: 600;
letter-spacing: 0.1em;
color: var(--primary);
text-transform: uppercase;
}

.nav-actions {
display: flex;
align-items: center;
gap: 16px;
}

.cart-btn {
position: relative;
padding: 8px;
display: flex;
align-items: center;
justify-content: center;
}

.cart-badge {
position: absolute;
top: 2px;
right: 2px;
background: var(--primary-accent);
color: white;
font-size: 0.65rem;
font-weight: 700;
width: 18px;
height: 18px;
border-radius: var(--radius-full);
display: flex;
align-items: center;
justify-content: center;
}

/* ---------------------------------
HERO BANNER
--------------------------------- */
.hero {
padding: 30px 20px 20px;
text-align: center;
max-width: 650px;
margin: 0 auto;
}

.hero-tag {
font-size: 0.75rem;
text-transform: uppercase;
letter-spacing: 0.15em;
color: var(--primary-accent);
font-weight: 600;
margin-bottom: 6px;
}

.hero h1 {
font-family: var(--font-serif);
font-size: 2.2rem;
font-weight: 500;
line-height: 1.2;
margin-bottom: 10px;
color: var(--primary);
}

.hero p {
font-size: 0.9rem;
color: var(--text-muted);
}

/* ---------------------------------
CATEGORY FILTERS (SCROLLABLE)
--------------------------------- */
.categories-wrapper {
padding: 10px 20px 20px;
display: flex;
gap: 8px;
overflow-x: auto;
scrollbar-width: none;
-ms-overflow-style: none;
}
.categories-wrapper::-webkit-scrollbar {
display: none;
}

.cat-pill {
white-space: nowrap;
padding: 7px 16px;
border-radius: var(--radius-full);
font-size: 0.85rem;
font-weight: 500;
background: var(--bg-white);
border: 1px solid var(--border-color);
color: var(--text-muted);
}

.cat-pill.active {
background: var(--primary);
color: white;
border-color: var(--primary);
}

/* ---------------------------------
PRODUCT GRID
--------------------------------- */
.container {
max-width: 1200px;
margin: 0 auto;
padding: 0 16px;
}

.product-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 14px;
}

@media (min-width: 768px) {
.product-grid {
grid-template-columns: repeat(3, 1fr);
gap: 24px;
}
}

@media (min-width: 1024px) {
.product-grid {
grid-template-columns: repeat(4, 1fr);
}
}

.product-card {
background: var(--bg-white);
border-radius: var(--radius-md);
overflow: hidden;
border: 1px solid var(--border-color);
box-shadow: var(--shadow-sm);
display: flex;
flex-direction: column;
position: relative;
}

.badge {
position: absolute;
top: 10px;
left: 10px;
background: rgba(255, 255, 255, 0.9);
backdrop-filter: blur(4px);
padding: 3px 8px;
border-radius: var(--radius-sm);
font-size: 0.68rem;
font-weight: 600;
color: var(--primary-accent);
letter-spacing: 0.05em;
text-transform: uppercase;
z-index: 2;
}

.card-img-wrap {
width: 100%;
aspect-ratio: 3 / 4;
background: #f0ece8;
overflow: hidden;
cursor: pointer;
}

.card-img-wrap img {
width: 100%;
height: 100%;
object-fit: cover;
transition: transform 0.4s ease;
}

.card-img-wrap:hover img {
transform: scale(1.03);
}

.card-info {
padding: 12px;
display: flex;
flex-direction: column;
flex-grow: 1;
}

.card-category {
font-size: 0.7rem;
color: var(--text-muted);
text-transform: uppercase;
letter-spacing: 0.05em;
margin-bottom: 2px;
}

.card-title {
font-size: 0.92rem;
font-weight: 600;
color: var(--primary);
margin-bottom: 6px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.price-box {
display: flex;
align-items: baseline;
gap: 6px;
margin-bottom: 12px;
}

.price-current {
font-weight: 700;
font-size: 1rem;
color: var(--primary);
}

.price-original {
font-size: 0.78rem;
color: var(--text-muted);
text-decoration: line-through;
}

.card-actions {
margin-top: auto;
display: flex;
gap: 6px;
}

.btn-quick-wa {
flex: 1;
background: var(--wa-green);
color: white;
padding: 8px 10px;
border-radius: var(--radius-sm);
font-size: 0.78rem;
font-weight: 600;
display: flex;
align-items: center;
justify-content: center;
gap: 5px;
}

.btn-quick-wa:hover {
background: var(--wa-hover);
}

.btn-details {
background: var(--bg-cream);
border: 1px solid var(--border-color);
border-radius: var(--radius-sm);
padding: 8px 10px;
font-size: 0.78rem;
font-weight: 500;
color: var(--text-main);
}

/* ---------------------------------
MODAL (PRODUCT DETAILS)
--------------------------------- */
.modal-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.6);
backdrop-filter: blur(4px);
display: none;
align-items: flex-end;
justify-content: center;
z-index: 100;
}

@media (min-width: 640px) {
.modal-overlay {
align-items: center;
padding: 20px;
}
}

.modal-sheet {
background: var(--bg-white);
width: 100%;
max-width: 500px;
border-radius: 20px 20px 0 0;
max-height: 90vh;
overflow-y: auto;
padding: 20px;
position: relative;
animation: slideUp 0.3s ease;
}

@media (min-width: 640px) {
.modal-sheet {
border-radius: 20px;
max-height: 85vh;
}
}

@keyframes slideUp {
from { transform: translateY(100%); }
to { transform: translateY(0); }
}

.modal-close {
position: absolute;
top: 14px;
right: 14px;
background: #f3f3f3;
width: 32px;
height: 32px;
border-radius: var(--radius-full);
display: flex;
align-items: center;
justify-content: center;
font-weight: bold;
z-index: 10;
}

.modal-img {
width: 100%;
height: 280px;
object-fit: cover;
border-radius: var(--radius-md);
margin-bottom: 14px;
}

.option-title {
font-size: 0.8rem;
font-weight: 600;
color: var(--text-muted);
text-transform: uppercase;
letter-spacing: 0.05em;
margin-bottom: 6px;
}

.size-picker {
display: flex;
gap: 8px;
margin-bottom: 16px;
}

.size-btn {
width: 42px;
height: 42px;
border: 1px solid var(--border-color);
border-radius: var(--radius-sm);
display: flex;
align-items: center;
justify-content: center;
font-size: 0.85rem;
font-weight: 600;
}

.size-btn.active {
background: var(--primary);
color: white;
border-color: var(--primary);
}

.modal-actions {
display: flex;
flex-direction: column;
gap: 10px;
margin-top: 16px;
}

.btn-primary-wa {
background: var(--wa-green);
color: white;
padding: 14px;
border-radius: var(--radius-md);
font-size: 0.95rem;
font-weight: 600;
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
width: 100%;
box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
}

.btn-add-cart {
background: var(--primary);
color: white;
padding: 12px;
border-radius: var(--radius-md);
font-size: 0.9rem;
font-weight: 600;
width: 100%;
}

/* ---------------------------------
CART DRAWER
--------------------------------- */
.cart-drawer {
position: fixed;
top: 0;
right: 0;
width: 100%;
max-width: 380px;
height: 100%;
background: var(--bg-white);
z-index: 120;
box-shadow: -5px 0 25px rgba(0, 0, 0, 0.15);
transform: translateX(100%);
transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
display: flex;
flex-direction: column;
}

.cart-drawer.open {
transform: translateX(0);
}

.cart-header {
padding: 16px 20px;
border-bottom: 1px solid var(--border-color);
display: flex;
justify-content: space-between;
align-items: center;
}

.cart-items {
flex: 1;
overflow-y: auto;
padding: 16px 20px;
display: flex;
flex-direction: column;
gap: 14px;
}

.cart-item {
display: flex;
gap: 12px;
border-bottom: 1px solid #f5f5f5;
padding-bottom: 12px;
}

.cart-item-img {
width: 65px;
height: 80px;
object-fit: cover;
border-radius: var(--radius-sm);
}

.cart-item-info {
flex: 1;
}

.cart-footer {
padding: 20px;
border-top: 1px solid var(--border-color);
background: var(--bg-cream);
}

.cart-total-row {
display: flex;
justify-content: space-between;
font-size: 1.1rem;
font-weight: 700;
margin-bottom: 14px;
}

/* Floating WhatsApp Contact Icon */
.floating-help {
position: fixed;
bottom: 20px;
right: 20px;
background: var(--wa-green);
color: white;
width: 48px;
height: 48px;

box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
display: flex;
align-items: center;
justify-content: center;
z-index: 30;
}
</style>
</head>

const buttons = document.querySelectorAll(".cat-pill");
buttons.forEach(btn => {
btn.classList.toggle("active", btn.textContent.includes(cat) || (cat === "All" && btn.textContent.includes("All")));
});
renderProducts();
}

// 5. MODAL MANAGEMENT
function openModal(id) {
selectedProduct = products.find(p => p.id === id);
selectedSize = "M"; // Reset to default

document.getElementById("modalImg").src = selectedProduct.image;
document.getElementById("modalCategory").textContent = selectedProduct.category;
document.getElementById("modalTitle").textContent = selectedProduct.title;
document.getElementById("modalPrice").textContent = `${CURRENCY}${selectedProduct.price.toLocaleString('en-IN')}`;
document.getElementById("modalOriginalPrice").textContent = `${CURRENCY}${selectedProduct.originalPrice.toLocaleString('en-IN')}`;
document.getElementById("modalDesc").textContent = selectedProduct.description;

// Reset size buttons
document.querySelectorAll(".size-btn").forEach(btn => {
btn.classList.toggle("active", btn.textContent === selectedSize);
});

// Update Modal WhatsApp Button
document.getElementById("modalWaBtn").onclick = () => {
orderSingleViaWhatsApp(selectedProduct, selectedSize);
};

document.getElementById("modalAddToCartBtn").onclick = () => {
addToCart(selectedProduct, selectedSize);
closeModal();
toggleCart(true);
};

modal.style.display = "flex";
document.body.style.overflow = "hidden";
}

function closeModal() {
modal.style.display = "none";
document.body.style.overflow = "auto";
}

function closeModalOnOverlay(e) {
if (e.target === modal) closeModal();
}

function selectSize(size) {
selectedSize = size;
document.querySelectorAll(".size-btn").forEach(btn => {
btn.classList.toggle("active", btn.textContent === size);
});
}

// 6. WHATSAPP DIRECT LINK BUILDER
function generateWhatsAppUrl(messageText) {
return `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(messageText)}`;
}

function quickWhatsAppOrder(productId) {
const prod = products.find(p => p.id === productId);
// Ask or default to M if quick clicked
orderSingleViaWhatsApp(prod, "M (Standard)");
}

function orderSingleViaWhatsApp(product, size) {
const msg =
`Hello ZAYA Boutique,

I want to place an order for this product:
*Item:* ${product.title} (Code: ${product.id})
*Price:* ${CURRENCY}${product.price}
*Size:* ${size}

Please confirm stock availability and share payment/delivery details.`;

window.open(generateWhatsAppUrl(msg), "_blank");
}

// 7. CART FUNCTIONALITY
function addToCart(product, size) {
const existing = cart.find(item => item.id === product.id && item.size === size);
if (existing) {
existing.qty += 1;
} else {
cart.push({ ...product, size, qty: 1 });
}
updateCartUI();
}

function changeQuantity(index, delta) {
cart[index].qty += delta;
if (cart[index].qty <= 0) {
cart.splice(index, 1);
}
updateCartUI();
}

function updateCartUI() {
const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

cartCount.textContent = totalCount;
cartDrawerCount.textContent = totalCount;
cartTotal.textContent = `${CURRENCY}${totalPrice.toLocaleString('en-IN')}`;

if (cart.length === 0) {
cartItemsContainer.innerHTML = `
<div style="text-align:center; padding: 40px 10px; color: var(--text-muted);">
Your shopping bag is currently empty.
</div>
`;
return;
}

cartItemsContainer.innerHTML = cart.map((item, idx) => `
<div class="cart-item">
<img src="${item.image}" alt="${item.title}" class="cart-item-img">
<div class="cart-item-info">
<h4 style="font-size: 0.88rem; font-weight: 600;">${item.title}</h4>
<div style="font-size: 0.75rem; color: var(--text-muted); margin: 2px 0;">Size: ${item.size}</div>
<div style="font-size: 0.85rem; font-weight: 700;">${CURRENCY}${item.price.toLocaleString('en-IN')}</div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
<button onclick="changeQuantity(${idx}, -1)" style="border:1px solid #ccc; width:22px; height:22px; border-radius:4px;">-</button>
<span style="font-size: 0.85rem;">${item.qty}</span>
<button onclick="changeQuantity(${idx}, 1)" style="border:1px solid #ccc; width:22px; height:22px; border-radius:4px;">+</button>
</div>
</div>
</div>
`).join("");
}

function toggleCart(show) {
cartDrawer.classList.toggle("open", show);
}

document.getElementById("openCartBtn").addEventListener("click", () => toggleCart(true));

// 8. MULTI-ITEM CHECKOUT VIA WHATSAPP
function checkoutViaWhatsApp() {
if (cart.length === 0) {
alert("Your bag is empty!");
return;
}

let orderList = cart.map((item, i) =>
`${i + 1}. *${item.title}* | Size: ${item.size} | Qty: ${item.qty} | ${CURRENCY}${item.price * item.qty}`
).join("\n");

const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

const message =
`Hello ZAYA Boutique,

I would like to order the following items from my shopping bag:

${orderList}

*Grand Total:* ${CURRENCY}${total.toLocaleString('en-IN')}

Please share payment options (UPI/Bank) and estimated delivery time.`;

window.open(generateWhatsAppUrl(message), "_blank");
}

// Initial render
renderProducts();
updateCartUI();
</script>
</body>
</html>
